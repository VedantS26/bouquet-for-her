ko<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>For You ❤️</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {

    margin: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #000;
}

body {

    display: flex;

    justify-content: center;
    align-items: center;

    font-family: Arial, sans-serif;
}

canvas {

    width: 100vw;
    height: 100vh;

    display: block;
}

.message {

    position: absolute;

    bottom: 35px;

    width: 100%;

    padding: 0 20px;

    text-align: center;

    color: #ffb6c9;

    font-family: Georgia, serif;

    font-size: 18px;

    line-height: 1.5;

    letter-spacing: 1px;

    opacity: 0;

    transition: opacity 2s ease;

    pointer-events: none;

}

.message.show {

    opacity: 1;

}

</style>

</head>


<body>


<canvas id="heartCanvas"></canvas>


<!-- FINAL MESSAGE -->

<div id="message" class="message">

    Every little "I love you" was meant for you. ❤️

</div>


<script>


/* =========================================
   CANVAS SETUP
========================================= */

const canvas =
    document.getElementById("heartCanvas");

const ctx =
    canvas.getContext("2d");

const message =
    document.getElementById("message");


function resizeCanvas() {

    const dpr =
        window.devicePixelRatio || 1;

    canvas.width =
        window.innerWidth * dpr;

    canvas.height =
        window.innerHeight * dpr;

    canvas.style.width =
        window.innerWidth + "px";

    canvas.style.height =
        window.innerHeight + "px";

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );
}


resizeCanvas();


window.addEventListener(
    "resize",
    resizeCanvas
);


/* =========================================
   SETTINGS
========================================= */


/*
   This is the text that forms the heart.
*/

const text =
    "I love you";


/*
   Size of each "I love you".
*/

const fontSize =
    8;


/*
   Color of the words.
*/

const color =
    "#ffb6c9";


/*
   Create lots of points
   to make the heart dense.
*/

const points = [];


/* =========================================
   HEART FORMULA
========================================= */

function heartPoint(t, scale) {

    const x =
        16 *
        Math.pow(
            Math.sin(t),
            3
        );


    const y =
        13 *
        Math.cos(t)

        - 5 *
        Math.cos(2 * t)

        - 2 *
        Math.cos(3 * t)

        - Math.cos(4 * t);


    return {

        x: x * scale,

        y: -y * scale

    };

}


/* =========================================
   CREATE HEART
========================================= */


/*
   Multiple layers make the heart
   thicker and more detailed.
*/

for (
    let layer = 0;
    layer < 17;
    layer++
) {

    const scale =
        11 + layer * 0.38;


    for (
        let i = 0;
        i < 120;
        i++
    ) {

        const angle =
            i *
            (Math.PI * 2 / 120);


        const point =
            heartPoint(
                angle,
                scale
            );


        /*
           Small randomness gives
           the heart a natural look.
        */

        point.x +=
            (Math.random() - 0.5) * 2;


        point.y +=
            (Math.random() - 0.5) * 2;


        points.push(point);

    }

}


/* =========================================
   SHUFFLE
========================================= */

function shuffle(array) {

    for (
        let i = array.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(
                Math.random() * (i + 1)
            );


        [
            array[i],
            array[j]
        ] =
        [
            array[j],
            array[i]
        ];

    }

}


shuffle(points);


/* =========================================
   ANIMATION
========================================= */


let currentPoint = 0;


/*
   Increase this number if you want
   the heart to appear faster.

   Lower number = slower drawing.
*/

const speed = 2;


function animate() {


    /*
       Clear screen.
    */

    ctx.clearRect(
        0,
        0,
        window.innerWidth,
        window.innerHeight
    );


    /*
       Center of screen.
    */

    const centerX =
        window.innerWidth / 2;


    const centerY =
        window.innerHeight / 2;


    /*
       Automatically resize heart
       depending on phone screen.
    */

    const scaleFactor =
        Math.min(

            window.innerWidth / 650,

            window.innerHeight / 800

        );


    ctx.save();


    ctx.translate(
        centerX,
        centerY
    );


    ctx.scale(
        scaleFactor,
        scaleFactor
    );


    /*
       Text styling.
    */

    ctx.fillStyle =
        color;


    ctx.font =
        `bold ${fontSize}px Arial`;


    ctx.textAlign =
        "center";


    ctx.textBaseline =
        "middle";


    /*
       Create new words.
    */

    for (
        let i = 0;

        i < speed;

        i++
    ) {

        if (
            currentPoint >=
            points.length
        ) {

            break;

        }


        currentPoint++;

    }


    /*
       Draw all created words.
    */

    for (
        let i = 0;

        i < currentPoint;

        i++
    ) {

        const p =
            points[i];


        ctx.fillText(

            text,

            p.x,

            p.y

        );

    }


    ctx.restore();


    /*
       Show final message
       after heart is complete.
    */

    if (
        currentPoint >=
        points.length
    ) {

        message.classList.add(
            "show"
        );

    }


    requestAnimationFrame(
        animate
    );

}


requestAnimationFrame(
    animate
);


</script>

</body>

</html>
