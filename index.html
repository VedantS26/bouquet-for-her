<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>A Bouquet For You 💐</title>

<style>

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

body {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Georgia, serif;
    color: white;
}

.screen {
    width: min(100vw, 700px);
    height: 100vh;
    min-height: 650px;
    position: relative;

    display: flex;
    align-items: center;
    justify-content: center;
}


/* ---------------- TITLE ---------------- */

.title {
    position: absolute;
    top: 28px;
    left: 0;

    width: 100%;
    text-align: center;

    font-size: clamp(18px, 4vw, 25px);
    letter-spacing: 1px;

    opacity: 0;

    animation: fadeIn 1.2s forwards;
}

.title span {
    color: #ff6b9d;
}


/* ---------------- SVG ---------------- */

svg {
    width: 96%;
    max-height: 88vh;
    overflow: visible;
}


/* ---------------- DRAWING ANIMATION ---------------- */

.draw {

    fill: none;

    stroke-linecap: round;
    stroke-linejoin: round;

    stroke-dasharray: 2000;
    stroke-dashoffset: 2000;

    animation: draw 2s ease forwards;
}

.slow {
    animation-duration: 2.8s;
}

.medium {
    animation-duration: 2s;
}

.fast {
    animation-duration: 1.3s;
}


/* ---------------- FLOWER BLOOM ---------------- */

.flower-fill {

    opacity: 0;

    animation:
        bloom .8s ease forwards;
}


/* ---------------- GLOW ---------------- */

.glow {

    filter:
        drop-shadow(0 0 5px currentColor);
}


/* ---------------- FINAL MESSAGE ---------------- */

#final {

    opacity: 0;

    animation:
        finalText 1.5s ease forwards;

    animation-delay: 12.5s;
}


/* ---------------- FLOATING HEARTS ---------------- */

.heart {

    position: absolute;

    bottom: -30px;

    font-size: 20px;

    opacity: 0;

    animation:
        floatUp 5s linear infinite;
}


/* ---------------- ANIMATIONS ---------------- */

@keyframes draw {

    to {
        stroke-dashoffset: 0;
    }

}


@keyframes bloom {

    to {
        opacity: 1;
    }

}


@keyframes fadeIn {

    to {
        opacity: .9;
    }

}


@keyframes finalText {

    to {
        opacity: 1;
    }

}


@keyframes floatUp {

    0% {

        transform:
            translateY(0)
            scale(.7);

        opacity: 0;
    }

    15% {

        opacity: .8;
    }

    100% {

        transform:
            translateY(-100vh)
            scale(1.3);

        opacity: 0;
    }

}


/* ---------------- MOBILE ---------------- */

@media (max-width: 500px) {

    .screen {
        min-height: 100vh;
    }

    svg {
        width: 105%;
    }

}

</style>
</head>


<body>

<script>

/*
    Add floating hearts after
    the bouquet is almost finished.
*/

setTimeout(() => {

    for (let i = 0; i < 12; i++) {

        const heart =
            document.createElement("div");

        heart.className = "heart";

        heart.textContent =
            ["♥", "♡", "✦"][i % 3];

        heart.style.left =
            (5 + Math.random() * 90) + "%";

        heart.style.animationDelay =
            (Math.random() * 3) + "s";

        heart.style.color =
            i % 2
                ? "#ff7fae"
                : "#ffffff";

        document
            .querySelector(".screen")
            .appendChild(heart);
    }

}, 9000);

</script>
